 <!-- Add Project Modal -->
<div id="add-project-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm">
    <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full p-6 relative border-t-4 border-[#800020]">
        <button id="close-project-modal" class="absolute top-3 left-3 text-slate-400 hover:text-slate-600 text-lg">
            <i class="fas fa-times"></i>
        </button>
        <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
            <i class="fas fa-folder-plus text-[#800020]"></i> إضافة مشروع جديد
        </h3>
        <form id="add-project-form" class="space-y-3 text-xs">
            <div>
                <label class="block font-bold text-slate-700 mb-1">عنوان المشروع:</label>
                <input type="text" id="project-title" required placeholder="مثال: نظام إدارة عيادة أسنان" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#800020]/20 border-slate-200">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">نوع الميديا:</label>
                    <select id="project-media-type" class="w-full px-3 py-2 border rounded-lg focus:outline-none border-slate-200 bg-white">
                        <option value="image">صور (حتى 10 صور)</option>
                        <option value="video">فيديو (Video / MP4)</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">اختر ملف/ملفات الميديا (حتى 10):</label>
                    <input type="file" id="project-media-file" required accept="image/*,video/*" multiple class="w-full text-slate-600 border border-slate-200 p-1.5 rounded-lg">
                </div>
            </div>
            <div>
                <label class="block font-bold text-slate-700 mb-1">وصف المشروع:</label>
                <textarea id="project-desc" rows="3" required placeholder="شرح تفصيلي للتقنيات والخدمات..." class="w-full px-3 py-2 border rounded-lg focus:outline-none border-slate-200 resize-none"></textarea>
            </div>
            <div>
                <label class="block font-bold text-slate-700 mb-1">التقنيات (افصل بينها بفاصلة):</label>
                <input type="text" id="project-tags" placeholder="HTML, CSS, JS, C++" class="w-full px-3 py-2 border rounded-lg focus:outline-none border-slate-200">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">رابط المعاينة (Demo - اختياري):</label>
                    <input type="url" id="project-demo" placeholder="https://..." class="w-full px-3 py-2 border rounded-lg focus:outline-none border-slate-200">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">رابط الكود (GitHub - اختياري):</label>
                    <input type="url" id="project-github" placeholder="https://github.com/..." class="w-full px-3 py-2 border rounded-lg focus:outline-none border-slate-200">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button type="button" id="cancel-project-add" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 transition font-bold">إلغاء</button>
                <button type="submit" id="submit-project-btn" class="px-4 py-2 bg-[#800020] text-white rounded-lg hover:bg-[#600018] transition font-bold shadow-md">رفع وحفظ المشروع</button>
            </div>
        </form>
    </div>
</div>
